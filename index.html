<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saving Sabrina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #140f24;
    --night2: #2a1d48;
    --panel: #221a35;
    --panel-edge: #3d3058;
    --text: #f3ead8;
    --muted: #b8a9cf;
    --gold: #f2c45a;
    --rose: #ff6f98;
    --danger: #ff5a4a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 42% 30%, #fff6 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 40%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 22% 64%, #fff5 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 80%, #fff5 50%, transparent 51%),
      radial-gradient(ellipse at 50% 120%, var(--night2), var(--night) 70%);
    background-color: var(--night);
    color: var(--text);
    font-family: 'Nunito', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 12px; gap: 8px; }

  /* HUD */
  #hud {
    width: 100%; max-width: 820px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 12px; padding: 8px 12px;
  }
  #floorLabel { font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 17px; color: var(--gold); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat svg { width: 18px; height: 18px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 800; color: var(--text); cursor: pointer;
    background: #34284d; border: 2px solid #514070; border-radius: 9px; padding: 5px 10px;
  }
  button:hover { background: #40325e; }
  button:active { transform: translateY(1px); }
  button.off { opacity: .55; text-decoration: line-through; }
  button.primary { background: linear-gradient(#f6cf6a, #d9a53a); color: #3a2410; border-color: #a87a22; font-size: 18px; padding: 10px 26px; }
  button.primary:hover { background: linear-gradient(#ffd97a, #e3b048); }
  .kbd { opacity: .6; font-weight: 400; font-size: 12px; margin-left: 3px; }

  #stage { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 0; position: relative; }
  #tower { display: none; flex: none; }
  #tower.show { display: block; }
  #board { display: block; border-radius: 10px; box-shadow: 0 0 0 3px #0008, 0 12px 40px #000a, 0 0 60px #6b4fa033; }
  #hint { max-width: 820px; width: 100%; text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
  #menu {
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    background: #f3ead8; color: #3a2410; border: 3px solid #a87a22; border-radius: 10px; padding: 5px 12px;
    font-weight: 800; font-size: 13px; box-shadow: 0 4px 0 #0006; max-width: 100%;
  }
  #menu[hidden] { display: none; }
  #menu .menu-title { font-family: 'Cinzel Decorative', serif; font-size: 15px; color: #7a2a1a; margin-right: 4px; }
  #menu .item { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 2px; border-radius: 8px; text-transform: capitalize; }
  #menu .item canvas { width: 28px; height: 28px; }
  #menu .item.next { background: #f2c45a66; outline: 2px dashed #a87a22; }
  #menu .item.done { opacity: .5; text-decoration: line-through; }
  #menu .item.made { background: #f2c45a; box-shadow: 0 0 12px #f2c45a; }
  #menu .item b { color: #2f7a2f; text-decoration: none; }
  #menu .arrow { color: #a87a22; }
  .stat[hidden] { display: none; }
  .stat.flash { animation: statflash 1.2s ease-out; }
  @keyframes statflash {
    0% { transform: scale(1); } 15% { transform: scale(1.7); color: var(--gold); filter: drop-shadow(0 0 6px #f2c45a); }
    100% { transform: scale(1); }
  }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: #3a1420ee; border: 2px solid var(--danger); color: #ffe1dc; font-weight: 800;
    padding: 8px 16px; border-radius: 10px; display: none; text-align: center; max-width: 90%;
  }

  /* Touch pad */
  #pad { display: none; gap: 14px; align-items: center; }
  #pad .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 4px; }
  #pad button { padding: 0; font-size: 22px; }
  #pad .side { display: flex; flex-direction: column; gap: 6px; }
  #pad .side button { width: 74px; height: 48px; font-size: 14px; }
  @media (pointer: coarse) { #pad { display: flex; } .kbd { display: none; } }

  /* Overlays */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: #0b0816cc; backdrop-filter: blur(3px); z-index: 10;
  }
  #overlay.hidden { display: none; }
  .card {
    background: linear-gradient(#2a2042, #1d1630); border: 3px solid #5a4680; border-radius: 18px;
    padding: 26px 28px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 20px 60px #000c;
    max-height: calc(100vh - 32px); overflow: auto;
  }
  .card h1 { font-family: 'Cinzel Decorative', serif; font-weight: 900; font-size: clamp(32px, 8vw, 48px); margin: 6px 0 4px; color: var(--gold); text-shadow: 0 3px 0 #7a4a12, 0 0 24px #f2c45a55; line-height: 1.05; }
  .card h2 { font-family: 'Cinzel Decorative', serif; font-size: 26px; margin: 4px 0 8px; color: var(--gold); }
  .card .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: var(--rose); font-weight: 800; }
  .card p { color: var(--muted); line-height: 1.5; margin: 10px 0; }
  .card .story { color: var(--text); }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; margin: 14px auto; max-width: 340px; font-size: 14px; color: var(--muted); }
  .controls b { color: var(--text); white-space: nowrap; }
  .floors { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .floors button { width: 46px; height: 46px; font-size: 18px; }
  .floors button:disabled { opacity: .35; cursor: default; }
  .floors .best { display: block; font-size: 9px; font-weight: 400; opacity: .7; }
  .tower { width: 120px; height: auto; display: block; margin: 0 auto 4px; }
  #finaleArt { display: block; margin: 8px auto; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="floorLabel">Saving Sabrina</div>
    <span class="stat" title="Gems left">
      <svg viewBox="0 0 20 20"><path d="M10 2 L17 8 L10 18 L3 8 Z" fill="#ff6f98" stroke="#ffd0dd" stroke-width="1.2"/></svg>
      <span id="gems">0</span>
    </span>
    <span class="stat" title="Hammer swings">
      <svg viewBox="0 0 20 20"><rect x="9" y="7" width="2.6" height="12" rx="1" fill="#a9763f"/><rect x="4" y="2.5" width="12" height="5.5" rx="1.5" fill="#b9c0cc" stroke="#6d7482"/></svg>
      <span id="swings">0</span>
    </span>
    <span class="stat" id="keyStat" title="Keys" hidden>
      <svg viewBox="0 0 20 20"><circle cx="6" cy="10" r="3.6" fill="none" stroke="#f2c45a" stroke-width="2.2"/><path d="M9.5 10h8M15 10v3.5M12.5 10v2.5" stroke="#f2c45a" stroke-width="2.2"/></svg>
      <span id="keys">0</span>
    </span>
    <span class="stat" title="Moves">
      <svg viewBox="0 0 20 20"><path d="M6 17c-2 0-3-1.5-2.5-3.2L5 9h4l-.8 5c-.3 2-1.2 3-2.2 3zm8-6c-1 0-1.9-1-2.2-3L11 3h4l1.5 4.8C17 9.5 16 11 14 11z" fill="#b8a9cf"/></svg>
      <span id="moves">0</span>
    </span>
    <div class="btns">
      <button id="undoBtn" title="Undo (Z)">Undo<span class="kbd">Z</span></button>
      <button id="restartBtn" title="Restart floor (R)">Restart<span class="kbd">R</span></button>
      <button id="musicBtn" title="Music on/off (N)">Music</button>
      <button id="muteBtn" title="All sound on/off (M)">Sound</button>
      <button id="menuBtn" title="Menu (Esc)">Menu</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="tower" aria-hidden="true"></canvas>
    <canvas id="board"></canvas>
    <div id="toast"></div>
  </div>
  <div id="menu" hidden></div>
  <div id="hint"></div>
  <div id="pad">
    <div class="dpad">
      <span></span><button data-dir="up" aria-label="Up">&#9650;</button><span></span>
      <button data-dir="left" aria-label="Left">&#9664;</button><button data-dir="down" aria-label="Down">&#9660;</button><button data-dir="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="side">
      <button id="padSmash">Hammer</button>
      <button id="padUndo">Undo</button>
    </div>
  </div>
</div>
<div id="overlay"></div>

<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
