<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hunt for Sabrina's Treasure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b1626;
    --night2: #123552;
    --panel: #142538;
    --panel-edge: #2b4a66;
    --text: #f3ead8;
    --muted: #a9c3d6;
    --gold: #f2c45a;
    --rose: #ff6f98;
    --sea: #5fd3e8;
    --danger: #ff5a4a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 42% 30%, #fff6 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 40%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 22% 64%, #fff5 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 80%, #fff5 50%, transparent 51%),
      radial-gradient(ellipse at 50% 120%, var(--night2), var(--night) 70%);
    background-color: var(--night);
    color: var(--text);
    font-family: 'Nunito', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 12px; gap: 8px; }

  /* HUD */
  #hud {
    width: 100%; max-width: 820px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 12px; padding: 8px 12px;
  }
  #levelLabel { font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 17px; color: var(--gold); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat svg { width: 18px; height: 18px; }
  .stat[hidden] { display: none; }
  .stat.flash { animation: statflash 1.2s ease-out; }
  @keyframes statflash {
    0% { transform: scale(1); } 15% { transform: scale(1.7); color: var(--gold); filter: drop-shadow(0 0 6px #f2c45a); }
    100% { transform: scale(1); }
  }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button, .btnlink {
    font: inherit; font-weight: 800; color: var(--text); cursor: pointer; text-decoration: none; display: inline-block;
    background: #1f3a54; border: 2px solid #345d80; border-radius: 9px; padding: 5px 10px;
  }
  button:hover, .btnlink:hover { background: #28496a; }
  button:active { transform: translateY(1px); }
  button.off { opacity: .55; text-decoration: line-through; }
  button.primary { background: linear-gradient(#f6cf6a, #d9a53a); color: #3a2410; border-color: #a87a22; font-size: 18px; padding: 10px 26px; }
  button.primary:hover { background: linear-gradient(#ffd97a, #e3b048); }
  .kbd { opacity: .6; font-weight: 400; font-size: 12px; margin-left: 3px; }

  #stage { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
  #board { display: block; border-radius: 10px; box-shadow: 0 0 0 3px #0008, 0 12px 40px #000a, 0 0 60px #2f7fa033; }
  #hint { max-width: 820px; width: 100%; text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }
  #menu {
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    background: #f3ead8; color: #3a2410; border: 3px solid #a87a22; border-radius: 10px; padding: 5px 12px;
    font-weight: 800; font-size: 13px; box-shadow: 0 4px 0 #0006; max-width: 100%;
  }
  #menu[hidden] { display: none; }
  #menu .menu-title { font-family: 'Cinzel Decorative', serif; font-size: 15px; color: #1f6a5a; margin-right: 4px; }
  #menu .item { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 2px; border-radius: 8px; text-transform: capitalize; }
  #menu .item canvas { width: 28px; height: 28px; }
  #menu .item.next { background: #f2c45a66; outline: 2px dashed #a87a22; }
  #menu .item.done { opacity: .5; text-decoration: line-through; }
  #menu .item.made { background: #f2c45a; box-shadow: 0 0 12px #f2c45a; }
  #menu .item b { color: #2f7a2f; text-decoration: none; }
  #menu .arrow { color: #a87a22; }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: #3a1420ee; border: 2px solid var(--danger); color: #ffe1dc; font-weight: 800;
    padding: 8px 16px; border-radius: 10px; display: none; text-align: center; max-width: 90%; z-index: 2;
  }

  /* Touch pad */
  #pad { display: none; gap: 14px; align-items: center; }
  #pad .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 4px; }
  #pad button { padding: 0; font-size: 22px; }
  #pad .side { display: flex; flex-direction: column; gap: 6px; }
  #pad .side button { width: 74px; height: 48px; font-size: 14px; }
  @media (pointer: coarse) { #pad { display: flex; } .kbd { display: none; } }

  /* Overlays */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: #050c16cc; backdrop-filter: blur(3px); z-index: 10;
  }
  #overlay.hidden { display: none; }
  .card {
    background: linear-gradient(#17304a, #0f2033); border: 3px solid #36648a; border-radius: 18px;
    padding: 26px 28px; max-width: 540px; width: 100%; text-align: center; box-shadow: 0 20px 60px #000c;
    max-height: calc(100vh - 32px); overflow: auto;
  }
  .card h1 { font-family: 'Cinzel Decorative', serif; font-weight: 900; font-size: clamp(28px, 7vw, 42px); margin: 6px 0 4px; color: var(--gold); text-shadow: 0 3px 0 #7a4a12, 0 0 24px #f2c45a55; line-height: 1.08; }
  .card h2 { font-family: 'Cinzel Decorative', serif; font-size: 26px; margin: 4px 0 8px; color: var(--gold); }
  .card .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: var(--sea); font-weight: 800; }
  .card p { color: var(--muted); line-height: 1.5; margin: 10px 0; }
  .card .story { color: var(--text); }
  .card .secret { color: #ffd0dd; font-style: italic; }
  .card canvas.art { display: block; margin: 8px auto; max-width: 100%; height: auto; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; margin: 14px auto; max-width: 340px; font-size: 14px; color: var(--muted); }
  .controls b { color: var(--text); white-space: nowrap; }
  .islands { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 16px; }
  .island-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .island-row .iname { font-size: 13px; color: var(--muted); font-weight: 800; min-width: 110px; text-align: right; }
  .island-row button { width: 46px; height: 46px; font-size: 18px; }
  .island-row button:disabled { opacity: .35; cursor: default; }
  .island-row .best { display: block; font-size: 9px; font-weight: 400; opacity: .7; }
  .gate input {
    font: inherit; font-weight: 800; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; text-align: center;
    width: 100%; max-width: 280px; padding: 10px 12px; margin: 6px auto 12px; display: block;
    border-radius: 10px; border: 3px solid #a87a22; background: #f3ead8; color: #3a2410; outline: none;
  }
  .gate input:focus { box-shadow: 0 0 0 4px #f2c45a66; }
  .gate .nope { color: #ffb3a8; font-weight: 800; min-height: 24px; }
  .gate.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .small { font-size: 13px; }
  .card a { color: var(--sea); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="levelLabel">The Hunt for Sabrina's Treasure</div>
    <span class="stat" title="Coins left">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="#f2c45a" stroke="#a87a22" stroke-width="1.6"/><circle cx="10" cy="10" r="4.4" fill="none" stroke="#c9952e" stroke-width="1.2"/></svg>
      <span id="coins">0</span>
    </span>
    <span class="stat" id="keyStat" title="Keys" hidden>
      <svg viewBox="0 0 20 20"><circle cx="6" cy="10" r="3.6" fill="none" stroke="#f2c45a" stroke-width="2.2"/><path d="M9.5 10h8M15 10v3.5M12.5 10v2.5" stroke="#f2c45a" stroke-width="2.2"/></svg>
      <span id="keys">0</span>
    </span>
    <span class="stat" title="Moves">
      <svg viewBox="0 0 20 20"><path d="M6 17c-2 0-3-1.5-2.5-3.2L5 9h4l-.8 5c-.3 2-1.2 3-2.2 3zm8-6c-1 0-1.9-1-2.2-3L11 3h4l1.5 4.8C17 9.5 16 11 14 11z" fill="#a9c3d6"/></svg>
      <span id="moves">0</span>
    </span>
    <div class="btns">
      <button id="undoBtn" title="Undo (Z)">Undo<span class="kbd">Z</span></button>
      <button id="restartBtn" title="Restart (R)">Restart<span class="kbd">R</span></button>
      <button id="musicBtn" title="Music on/off (N)">Music</button>
      <button id="muteBtn" title="All sound on/off (M)">Sound</button>
      <button id="menuBtn" title="Menu (Esc)">Menu</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="toast"></div>
  </div>
  <div id="menu" hidden></div>
  <div id="hint"></div>
  <div id="pad">
    <div class="dpad">
      <span></span><button data-dir="up" aria-label="Up">&#9650;</button><span></span>
      <button data-dir="left" aria-label="Left">&#9664;</button><button data-dir="down" aria-label="Down">&#9660;</button><button data-dir="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="side">
      <button id="padUndo">Undo</button>
      <button id="padRestart">Restart</button>
    </div>
  </div>
</div>
<div id="overlay"></div>

<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="../music.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
